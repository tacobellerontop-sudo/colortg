name: Build Triggerbot & Driver

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore WDK NuGet Packages
        run: |
          nuget restore packages.config -PackagesDirectory packages

      - name: Build User-Mode Triggerbot (GUI)
        run: |
          cl /std:c++20 /O2 /EHsc trigger.cpp /link user32.lib gdi32.lib comctl32.lib /SUBSYSTEM:WINDOWS /ENTRY:WinMainCRTStartup /OUT:trigger.exe

      - name: Build Kernel Driver
        shell: pwsh
        run: |
          $wdkPkg = Get-ChildItem -Directory "packages" -Filter "Microsoft.Windows.WDK.x64.*" | Select-Object -First 1
          $sdkPkg = Get-ChildItem -Directory "packages" -Filter "Microsoft.Windows.SDK.CPP.x64.*" | Select-Object -First 1

          if (-not $wdkPkg) { Write-Error "WDK package not found in packages\"; exit 1 }
          if (-not $sdkPkg) { Write-Error "SDK package not found in packages\"; exit 1 }

          $kitVer = (Get-ChildItem -Directory "$($wdkPkg.FullName)\c\Include" | Select-Object -First 1).Name
          Write-Host "Detected Kit version: $kitVer"

          $incKm     = "$($wdkPkg.FullName)\c\Include\$kitVer\km"
          $incKmCrt  = "$($wdkPkg.FullName)\c\Include\$kitVer\km\crt"
          $incShared = "$($wdkPkg.FullName)\c\Include\$kitVer\shared"
          $incSdkSh  = "$($sdkPkg.FullName)\c\Include\$kitVer\shared"
          $incUcrt   = "$($sdkPkg.FullName)\c\Include\$kitVer\ucrt"
          $libKm     = "$($wdkPkg.FullName)\c\Lib\$kitVer\km\x64"

          if (-not (Test-Path "$incSdkSh\specstrings.h")) {
            Write-Host "[WARN] specstrings.h not in $incSdkSh, falling back to runner system SDK..."
            $sysShared = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Include" -Filter "shared" -Recurse -ErrorAction SilentlyContinue | Where-Object { Test-Path "$($_.FullName)\specstrings.h" } | Select-Object -First 1
            if ($sysShared) { $incSdkSh = $sysShared.FullName }
          }

          if (-not (Test-Path "$incUcrt\crtdbg.h")) {
            $sysUcrt = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Include" -Filter "ucrt" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($sysUcrt) { $incUcrt = $sysUcrt.FullName }
          }

          Write-Host "--- Include Check ---"
          Write-Host "ntddk.h:       $(Test-Path "$incKm\ntddk.h") ($incKm)"
          Write-Host "specstrings.h: $(Test-Path "$incSdkSh\specstrings.h") ($incSdkSh)"
          Write-Host "lib dir:       $(Test-Path "$libKm") ($libKm)"

          cl /c /O2 /D_AMD64_ /D_WIN64 /DNDEBUG /GS- /W3 /Zl /kernel /nologo `
            "-I$incKm" "-I$incKmCrt" "-I$incShared" "-I$incSdkSh" "-I$incUcrt" `
            driver.c /Fo:driver.obj

          if ($LASTEXITCODE -ne 0) {
            Write-Error "cl.exe failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          $overflowLib = Get-ChildItem -Path "$libKm" -Filter "*BufferOverflow*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          $overflowLibName = if ($overflowLib) { $overflowLib.Name } else { "BufferOverflowFastFailK.lib" }
          Write-Host "Using buffer overflow lib: $overflowLibName"

          link /DRIVER /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /NODEFAULTLIB /nologo `
            /OUT:Driver.sys `
            "-LIBPATH:$libKm" `
            driver.obj ntoskrnl.lib hal.lib $overflowLibName

          if ($LASTEXITCODE -ne 0) {
            Write-Error "link.exe failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          Write-Host "Driver.sys linked successfully."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            trigger.exe
            Driver.sys
          if-no-files-found: error
